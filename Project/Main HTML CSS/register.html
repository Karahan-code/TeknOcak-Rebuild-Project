    <section class="register">
        <div class="wrap">
            <div class="heading box1" style="grid-area: box-1;">
                <h1>Kayıt Ol</h1>
            </div>
            <div class="input-box box2" style="grid-area: box-2;">
                <input type="text" required>
                <span>Ad</span>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box box3" style="grid-area: box-3;">
                <input type="text" required>
                <span>Soyad</span>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box box4" style="grid-area: box-4;">
                <input type="number" required>
                <span>TC No</span>
                <i class="fa-solid fa-address-card"></i>
            </div>
            <div class="input-box box5" style="grid-area: box-5;">
                <input type="email" required>
                <span>e-posta</span>
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box box6" style="grid-area: box-6;">
                <input type="password" required id="password">
                <span>Şifre</span>
                <i class="fa-solid fa-eye" id="Shower"></i>
            </div>
            <div class="input-box box7" style="grid-area: box-7;">
                <input type="date" required max="2025-12-31">
                <i class="fa-solid fa-calendar-days"></i>
            </div>
            <div class="input-box box8" style="grid-area: box-8;">
                <label for="cinsiyet">Cinsiyet:</label>
                <select name="cinsiyet" id="cinsiyet">
                    <option value="Seçiniz">Seçiniz</option>
                    <option value="Erkek">Erkek</option>
                    <option value="Kadın">Kadın</option>
                </select>
            </div>
            <div class="input-box box9" style="grid-area: box-9;">
                <input type="number" required>
                <span>Telefon</span>
                <i class="fa-solid fa-phone"></i>
            </div>
            <div class="input-box box10" style="grid-area: box-10;">
                <label for="rol">Rol:</label>
                <select name="rol" id="rol">
                    <option value="Seçiniz">Seçiniz</option>
                    <option value="Öğrenci">Öğrenci</option>
                    <option value="Akademisyen">Akademisyen</option>
                </select>
            </div>
            <div class="input-box box11" style="grid-area: box-11;">
                <label for="eğitim">Eğitim Durumu:</label>
                <select name="rol" id="rol">
                    <option value="Seçiniz">Seçiniz</option>
                    <option value="Lise">Lise</option>
                    <option value="Üniversite">Üniversite</option>
                    <option value="Mezun">Mezun</option>
                </select>
            </div>
            <div class="input-box box12" style="grid-area: box-12;">
                <input type="text" required>
                <span>Şehir</span>
                <i class="fa-solid fa-city"></i>
            </div>
            <div class="button box13" style="grid-area: box-13;">
                <button>Kayıt Ol</button>
            </div>
        </div>
        </div>
    </section>
